name: second_brain
description: A new Flutter project for Second Brain.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.1
  flutter_markdown: ^0.6.17
  receive_sharing_intent: ^1.6.5
  intl: ^0.20.2
  path_provider: ^2.1.2
  share_plus: ^10.1.4
  home_widget: ^0.9.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/icon.png"
  ios_icon: "assets/icon.png" # Assuming high-res icon exists or will be provided

flutter:
  uses-material-design: true
  assets:
    - assets/
