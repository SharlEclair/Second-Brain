name: Build iOS App

on:
  push:
    branches: [ main, old-ui ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd flutter_client
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd flutter_client
          flutter build ios --release --no-codesign
          
      - name: Package as IPA for Sideloading
        run: |
          cd flutter_client/build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -yr SecondBrain.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-ios-ipa
          path: flutter_client/build/ios/iphoneos/SecondBrain.ipa
