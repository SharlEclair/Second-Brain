name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd flutter_client
          flutter pub get

      - name: Environment Diagnostics
        run: |
          flutter doctor
          ls -R flutter_client/ios

      - name: Build iOS (No Codesign)
        run: |
          cd flutter_client
          flutter build ios --release --no-codesign -v

      - name: Zip Build
        if: success()
        run: |
          zip -r Runner.zip flutter_client/build/ios/iphoneos/Runner.app

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: Runner.zip
