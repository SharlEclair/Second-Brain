name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd flutter_client
          flutter pub get

      - name: Recreate iOS Project
        run: |
          cd flutter_client
          rm -rf ios
          flutter create . --platforms ios --org com.example.secondBrain

      - name: Patch Info.plist
        run: |
          cat <<EOF > flutter_client/ios/Runner/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CADisableMinimumFrameDurationOnPhone</key>
            <true/>
            <key>CFBundleDevelopmentRegion</key>
            <string>\$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleDisplayName</key>
            <string>Second Brain</string>
            <key>CFBundleExecutable</key>
            <string>\$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>\$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>second_brain</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>\$(FLUTTER_BUILD_NAME)</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleVersion</key>
            <string>\$(FLUTTER_BUILD_NUMBER)</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeRole</key>
                <string>Editor</string>
                <key>CFBundleURLSchemes</key>
                <array>
                  <string>SharingSecondBrain</string>
                </array>
              </dict>
            </array>
            <key>LSApplicationQueriesSchemes</key>
            <array>
              <string>https</string>
              <string>http</string>
            </array>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIMainStoryboardFile</key>
            <string>Main</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Build iOS (No Codesign)
        run: |
          cd flutter_client
          flutter build ios --release --no-codesign

      - name: Zip Build
        if: success()
        run: |
          zip -r Runner.zip flutter_client/build/ios/iphoneos/Runner.app

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: Runner.zip
