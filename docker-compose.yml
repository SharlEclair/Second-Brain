version: '3.8'

services:
  cortex-redis:
    image: redis:latest
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  cortex-neo4j:
    image: neo4j:5-community
    container_name: cortex-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/cortexpassword123
    volumes:
      - neo4j_data:/data

volumes:
  redis_data:
  neo4j_data:
